<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sariema probe</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f4;
        --fg: #1c1c1a;
        --muted: #6b6b66;
        --ok: #1f7a3a;
        --no: #a3261b;
        --line: #d9d9d4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161615;
          --fg: #ececea;
          --muted: #9d9d97;
          --ok: #6fcf8c;
          --no: #ff8a7d;
          --line: #33332f;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p {
        color: var(--muted);
        margin: 0 0 16px;
      }
      ol {
        margin: 0 0 16px;
        padding-left: 20px;
      }
      button {
        font: inherit;
        padding: 10px 16px;
        min-height: 44px;
        margin: 0 8px 8px 0;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--fg);
        color: var(--bg);
      }
      button:disabled {
        opacity: 0.55;
      }
      #status {
        color: var(--fg);
        min-height: 1.45em;
      }
      #status.busy::before {
        content: "";
        display: inline-block;
        width: 0.8em;
        height: 0.8em;
        margin-right: 8px;
        border: 2px solid var(--muted);
        border-top-color: transparent;
        border-radius: 50%;
        vertical-align: -1px;
        animation: spin 0.8s linear infinite;
      }
      #status.over {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 12px);
        left: 12px;
        right: 12px;
        z-index: 11;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--bg);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #status.busy::before {
          animation: none;
        }
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0 16px;
      }
      td {
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      td:first-child {
        width: 45%;
        color: var(--muted);
        padding-right: 12px;
      }
      .ok {
        color: var(--ok);
      }
      .no {
        color: var(--no);
      }
      canvas {
        display: block;
        width: 100%;
        max-width: 480px;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 6px;
      }
      canvas.full {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        aspect-ratio: auto;
        border-radius: 0;
        z-index: 10;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        max-height: 320px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sariema probe</h1>
      <p>What this browser offers the engine.</p>
      <ol>
        <li>
          Tap <b>Run the test</b> once. It plays the demo game with its music
          for about 20 seconds, part of it full screen.
        </li>
        <li>Keep this tab in front and the screen on until it says Done.</li>
        <li>Tap <b>Copy the result</b> and paste it where you were asked.</li>
      </ol>
      <button id="smoke">Run the test</button>
      <button id="copy">Copy the result</button>
      <p id="status" role="status" aria-live="polite">Ready.</p>
      <table id="summary"></table>
      <canvas id="stage"></canvas>
      <pre id="json"></pre>
    </main>
    <script type="module" src="./probe.js"></script>
  </body>
</html>
