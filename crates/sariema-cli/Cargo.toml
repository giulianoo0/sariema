[package]
name = "sariema-cli"
description = "Command-line tool of the Sariema engine: builds, inspects, runs and tests room packs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sariema"
path = "src/main.rs"

[features]
# Counts the allocations `bench` reports, with a global allocator that
# wraps the system's for the whole binary; off in every other build.
alloc-count = []

[dependencies]
bytemuck.workspace = true
clap.workspace = true
glam.workspace = true
image.workspace = true
jsonschema.workspace = true
pollster.workspace = true
sariema-anim = { path = "../sariema-anim" }
sariema-audio = { path = "../sariema-audio" }
sariema-core = { path = "../sariema-core" }
sariema-format = { path = "../sariema-format" }
sariema-import = { path = "../sariema-import" }
sariema-physics = { path = "../sariema-physics" }
sariema-render = { path = "../sariema-render" }
sariema-runtime = { path = "../sariema-runtime" }
sariema-ui = { path = "../sariema-ui" }
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
sariema-vm = { path = "../sariema-vm" }
tempfile.workspace = true
