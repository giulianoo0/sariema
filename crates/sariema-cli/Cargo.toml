[package]
name = "sariema-cli"
description = "Command-line tool of the Sariema engine: builds, inspects, runs and tests room packs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sariema"
path = "src/main.rs"

[dependencies]
clap.workspace = true
glam.workspace = true
image.workspace = true
jsonschema.workspace = true
pollster.workspace = true
sariema-anim = { path = "../sariema-anim" }
sariema-core = { path = "../sariema-core" }
sariema-format = { path = "../sariema-format" }
sariema-import = { path = "../sariema-import" }
sariema-render = { path = "../sariema-render" }
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
