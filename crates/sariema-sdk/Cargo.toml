[package]
name = "sariema-sdk"
description = "The no_std Rust SDK a Sariema game uses: typed command builders, event iteration, entity handles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["panic-handler"]
# A `#[panic_handler]` for no_std games on wasm32 that logs the message and
# traps. Games built with std turn it off.
panic-handler = []

[dev-dependencies]
sariema-format = { path = "../sariema-format" }
