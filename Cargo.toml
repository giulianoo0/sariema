[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"

[workspace.dependencies]
ab_glyph = "0.2.32"
assert_cmd = "2.2.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
ctt-astcenc = "0.6.1"
# libm: the same f32 trigonometry on every platform, so a replay hashes alike
# natively and on wasm32.
glam = { version = "0.34.3", features = ["libm"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# No remote or file $ref resolution: the schemas are embedded.
jsonschema = { version = "0.61.2", default-features = false }
libm = "0.2.16"
log = "0.4.35"
meshopt = "0.7.0"
pollster = "1.0.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rtrb = "0.4.1"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# MPL-2.0, used unmodified as a library. Ogg Vorbis, MP3 and WAV only.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "pcm", "vorbis", "wav"] }
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
tempfile = "3.27.0"
wgpu = "30.0.2"
winit = "0.30.13"
# BSD-3-Clause (the C library) and MIT: KTX2 levels in Zstandard.
zstd = { version = "0.13.3", default-features = false }
# auto-dispatch falls back to a loop where the target cannot tail-call (wasm32
# without the tail-call proposal); the tail-call dispatch there recurses on
# the native stack once per instruction run, so a long tick overflows it.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "deterministic", "auto-dispatch"] }
wat = "1.263.0"
tinywasm = { version = "=0.12.0-beta.0", default-features = false, features = ["std", "parser", "validate", "canonicalize-nans"] }
js-sys = "0.3.107"
naga = "30.0.2"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"

# The ASTC encoder is C++ that cc builds at the package's opt-level; unoptimised it is about 100× slower.
[profile.dev.package.ctt-astcenc]
opt-level = 3

# Unoptimised, wasmi falls back to a dispatch that recurses on the native
# stack once per WebAssembly call, so a game's deep recursion could overflow
# the host's stack; optimised, it uses tail calls and traps cleanly.
[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
overflow-checks = false
