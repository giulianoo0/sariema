[package]
name = "cutaway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: the game builds apart from the engine's.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sariema-sdk = { path = "../../../crates/sariema-sdk" }

[profile.release]
opt-level = "s"
panic = "abort"
